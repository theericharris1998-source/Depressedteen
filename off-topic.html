```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Off-Topic - My Forum</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #333;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .button {
            display: inline-block;
            background-color: #333;
            color: white;
            padding: 12px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 15px 0;
        }

        .button:hover {
            background-color: #555;
        }

        .post {
            border: 1px solid #ddd;
            padding: 18px;
            margin-top: 15px;
            border-radius: 8px;
            background-color: #fafafa;
        }

        .post h2 {
            margin-top: 0;
        }

        .username {
            color: #666;
            font-size: 14px;
        }

        .post-content {
            margin-top: 15px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<header>
    <h1>Off-Topic</h1>
    <p>Talk about things that don't fit anywhere else.</p>
</header>

<div class="container">

    <a href="index.html">← Back to Forum</a>

    <h2>Off-Topic</h2>

    <a class="button" href="create-post.html?category=off-topic">
        ＋ Create a Post
    </a>

    <div id="posts"></div>

</div>

<script>

const postsContainer = document.getElementById("posts");

const posts = JSON.parse(
    localStorage.getItem("offTopicPosts")
) || [];

if (posts.length === 0) {

    postsContainer.innerHTML = `
        <div class="post">
            <strong>No posts yet.</strong>
            <p>Be the first person to start an off-topic discussion!</p>
        </div>
    `;

} else {

    posts.slice().reverse().forEach(function(post) {

        const postElement = document.createElement("div");

        postElement.className = "post";

        postElement.innerHTML = `
            <h2>${escapeHTML(post.title)}</h2>

            <div class="username">
                Posted by ${escapeHTML(post.username)}
            </div>

            <div class="post-content">
                ${escapeHTML(post.content)}
            </div>
        `;

        postsContainer.appendChild(postElement);

    });
}

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

</script>

</body>
</html>
```
