<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>General Discussion - My Forum</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;

            color: #666;

        .post-content {
            margin-top: 15px;

        }

        .post-actions {
            margin-top: 15px;
        }

        .edit-button,
        .delete-button {
            border: none;

            border-radius: 5px;
            cursor: pointer;
            color: white;
            margin-right: 8px;
        }

        .edit-button {
            background-color: #555;
        }

        .edit-button:hover {
            background-color: #333;
        }

        .delete-button {
            background-color: #b00020;
        }

        .delete-button:hover {
            background-color: #8b0019;
        }

            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>General Discussion</h1>
    <p>Talk about anything.</p>
</header>

<div class="container">

    <a href="index.html">
        ← Back to Forum
    </a>

    <h2>General Discussion</h2>

    <a
        class="button"
        href="create-post.html?category=general"
    >
        ＋ Create a Post
    </a>

    <p id="status">
        Loading posts...
    </p>

    <div id="posts"></div>

</div>

<script>

const SUPABASE_URL =
    "https://oumfxwatreftjyahiplr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DXNKHiVn5QV8DQj3ydTYlQ_zj9EZZTa";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function loadPosts() {

    const postsContainer =
        document.getElementById("posts");

    const status =
        document.getElementById("status");


    /*
     * Get the currently logged-in user.
     */

    const {
        data: {
            user
        }
    } =
        await supabaseClient.auth.getUser();


    const {
        data,
        error
    } =
        await supabaseClient
        .from("posts")
        .select("*")
        .eq("category", "general")
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        status.textContent =
            "Error loading posts: " +
            error.message;

        return;
    }


    status.textContent = "";


    if (!data || data.length === 0) {

        postsContainer.innerHTML = `
            <div class="post">
                <strong>No posts yet.</strong>
                <p>
                    Be the first person to start a discussion!
                </p>
            </div>
        `;

        return;
    }


    data.forEach(function(post) {

        const postElement =
            document.createElement("div");

        postElement.className =
            "post";


        let actions = "";


        /*
         * Only show Edit/Delete if
         * this post belongs to the
         * currently logged-in user.
         *
         * Your posts table uses user_id
         * to identify the owner.
         */

        if (user && post.user_id === user.id) {

            actions = `
                <div class="post-actions">

                    <button
                        class="edit-button"
                        onclick="editPost('${post.id}')"
                    >
                        Edit
                    </button>

                    <button
                        class="delete-button"
                        onclick="deletePost('${post.id}')"
                    >
                        Delete
                    </button>

                </div>
            `;
        }


        postElement.innerHTML = `

            <h2>
                <a href="post.html?id=${post.id}">
                    ${escapeHTML(post.title)}
                </a>
            </h2>

            <div class="username">
                Posted by
                ${escapeHTML(post.username)}
            </div>

            <div class="post-content">
                ${escapeHTML(post.content)}
            </div>

            ${actions}

        `;


        postsContainer.appendChild(
            postElement
        );

    });

}


/* EDIT POST */

function editPost(postId) {

    window.location.href =
        "edit-post.html?id=" +
        encodeURIComponent(postId);

}


/* DELETE POST */

async function deletePost(postId) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this post?"
        );


    if (!confirmed) {
        return;
    }


    const {
        error
    } =
        await supabaseClient
        .from("posts")
        .delete()
        .eq("id", postId);


    if (error) {

        alert(
            "Error deleting post: " +
            error.message
        );

        return;
    }


    loadPosts();

}


/* ESCAPE HTML */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


loadPosts();

</script>

</body>
</html>
