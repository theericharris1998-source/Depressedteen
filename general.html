```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Discussion - My Forum</title>
</head>

<body>

<h1>General Discussion</h1>

<a href="index.html">← Back to Forum</a>

<br><br>

<a href="create-post.html">＋ Create a Post</a>

<hr>

<div id="posts"></div>

<script>

const postsContainer = document.getElementById("posts");

const posts = JSON.parse(localStorage.getItem("forumPosts")) || [];

if (posts.length === 0) {

    postsContainer.innerHTML = `
        <h3>No posts yet.</h3>
        <p>Be the first person to start a discussion!</p>
    `;

} else {

    posts.reverse().forEach(function(post) {

        const postElement = document.createElement("div");

        postElement.innerHTML = `
            <h2>${escapeHTML(post.title)}</h2>
            <p><strong>Posted by:</strong> ${escapeHTML(post.username)}</p>
            <p>${escapeHTML(post.content)}</p>
            <hr>
        `;

        postsContainer.appendChild(postElement);

    });
}

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

</script>

</body>
</html>
```
