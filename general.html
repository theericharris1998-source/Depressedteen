<body>

<header>
    <h1>General Discussion</h1>
    <p>Talk about anything.</p>
</header>

<div class="container">

    <a href="index.html">← Back to Forum</a>

    <h2>General Discussion</h2>

    <a class="button" href="create-post.html?category=general">
        ＋ Create a Post
    </a>

    <p id="status">Loading posts...</p>

    <div id="posts"></div>

</div>

<script>

const SUPABASE_URL =
    "https://oumfxwatreftjyahiplr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DXNKHiVn5QV8DQj3ydTYlQ_zj9EZZTa";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function loadPosts() {

    const postsContainer =
        document.getElementById("posts");

    const status =
        document.getElementById("status");

    const { data, error } = await supabaseClient
        .from("posts")
        .select("*")
        .eq("category", "general")
        .order("created_at", { ascending: false });

    if (error) {

        status.textContent =
            "Error loading posts: " + error.message;

        return;
    }

    status.textContent = "";

    if (!data || data.length === 0) {

        postsContainer.innerHTML = `
            <div class="post">
                <strong>No posts yet.</strong>
                <p>Be the first person to start a discussion!</p>
            </div>
        `;

        return;
    }

    data.forEach(function(post) {

        const postElement =
            document.createElement("div");

        postElement.className = "post";

        postElement.innerHTML = `
          postElement.innerHTML = `
    <h2>
        <a href="post.html?id=${post.id}">
            ${escapeHTML(post.title)}
        </a>
    </h2>

    <div class="username">
        Posted by ${escapeHTML(post.username)}
    </div>

    <div class="post-content">
        ${escapeHTML(post.content)}
    </div>
`;

            <div class="username">
                Posted by ${escapeHTML(post.username)}
            </div>

            <div class="post-content">
                ${escapeHTML(post.content)}
            </div>
        `;

        postsContainer.appendChild(postElement);
    });
}

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

loadPosts();

</script>

</body>
</html>
