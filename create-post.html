```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Post - My Forum</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #333;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .back {
            color: #333;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        textarea {
            height: 180px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            background-color: #333;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

<header>
    <h1>Create a Post</h1>
    <p>Start a new discussion.</p>
</header>

<div class="container">

    <a class="back" href="general.html">← Back to General Discussion</a>

    <form id="postForm">

        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" required>

        <label for="title">Post Title</label>
        <input type="text" id="title" placeholder="Enter a title" required>

        <label for="content">Post</label>
        <textarea id="content" placeholder="Write your post here..." required></textarea>

        <button type="submit">Publish Post</button>

    </form>

</div>

<script>
document.getElementById("postForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const post = {
        username: document.getElementById("username").value,
        title: document.getElementById("title").value,
        content: document.getElementById("content").value
    };

    let posts = JSON.parse(localStorage.getItem("forumPosts")) || [];

    posts.push(post);

    localStorage.setItem("forumPosts", JSON.stringify(posts));

    window.location.href = "general.html";
});
</script>

</body>
</html>
```
