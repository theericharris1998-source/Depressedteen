<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create a Post - My Forum</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #333;
            color: white;

            max-width: 700px;

        }

        .back {
            color: #333;
            text-decoration: none;
        }

        .username-display {
            background: #f2f2f2;

        textarea {

            font-size: 15px;
        }

            background-color: #555;
        }

        button:disabled {
            background-color: #888;
            cursor: not-allowed;
        }

        #error {
            color: #b00020;
            margin-top: 15px;
        }

        #loginMessage {
            text-align: center;
            padding: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>Create a Post</h1>
    <p id="categoryText">Start a new discussion.</p>
</header>

<div class="container">

    <a class="back" id="backLink" href="index.html">
        ← Back to Forum
    </a>

    <div id="loading">
        <p>Checking your account...</p>
    </div>

    <div id="loginMessage" style="display:none;">

        <h2>You need an account</h2>

        <p>
            You must be logged in to create a post.
        </p>

        <a href="login.html">
            Log in or create an account
        </a>

    </div>

    <div id="postArea" style="display:none;">

        <h2 id="categoryTitle">New Post</h2>

        <div
            id="usernameDisplay"
            class="username-display"
        >
            Posting as...
        </div>

        <form id="postForm">

            <label for="title">
                Post Title
            </label>

            <input
                type="text"
                id="title"
                required
                maxlength="100"
            >

            <label for="content">
                Post
            </label>

            <textarea
                id="content"
                required
                maxlength="10000"
            ></textarea>

            <button
                id="submitButton"
                type="submit"
            >
                Publish Post
            </button>

            <div id="error"></div>

        </form>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://oumfxwatreftjyahiplr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DXNKHiVn5QV8DQj3ydTYlQ_zj9EZZTa";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const params =
    new URLSearchParams(
        window.location.search
    );

const category =
    params.get("category") ||
    "general";


const categoryInfo = {

    general: {
        name: "General Discussion",
        page: "general.html"
    },

    gaming: {
        name: "Gaming",
        page: "gaming.html"
    },

    "off-topic": {
        name: "Off-Topic",
        page: "off-topic.html"
    }

};


const selected =
    categoryInfo[category] ||
    categoryInfo.general;


document.getElementById("categoryText").textContent =
    "Create a post in " + selected.name;


document.getElementById("categoryTitle").textContent =
    selected.name;


document.getElementById("backLink").href =
    selected.page;


/* CHECK LOGIN */

async function checkLogin() {

    const loading =
        document.getElementById("loading");

    const loginMessage =
        document.getElementById("loginMessage");

    const postArea =
        document.getElementById("postArea");


    const {
        data: {
            user
        }
    } =
        await supabaseClient.auth.getUser();


    loading.style.display =
        "none";


    if (!user) {

        loginMessage.style.display =
            "block";

        return;
    }


    /*
     * Get username directly from
     * Supabase account metadata.
     */

    const username =
        user.user_metadata?.username;


    if (!username) {

        loginMessage.style.display =
            "block";

        loginMessage.innerHTML = `

            <h2>Username not found</h2>

            <p>
                Your account does not have a username.
            </p>

            <a href="account.html">
                Go to My Account
            </a>

        `;

        return;
    }


    postArea.style.display =
        "block";


    document
        .getElementById("usernameDisplay")
        .textContent =
        "Posting as: " + username;

}


/* CREATE POST */

document
    .getElementById("postForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const title =
                document
                .getElementById("title")
                .value
                .trim();


            const content =
                document
                .getElementById("content")
                .value
                .trim();


            const errorBox =
                document
                .getElementById("error");


            const button =
                document
                .getElementById("submitButton");


            errorBox.textContent =
                "";


            if (!title || !content) {

                errorBox.textContent =
                    "Please fill out every field.";

                return;
            }


            const {
                data: {
                    user
                }
            } =
                await supabaseClient.auth.getUser();


            if (!user) {

                errorBox.textContent =
                    "You must be logged in to post.";

                return;
            }


            const username =
                user.user_metadata?.username;


            if (!username) {

                errorBox.textContent =
                    "Your account does not have a username.";

                return;
            }


            button.disabled =
                true;

            button.textContent =
                "Publishing...";


            const {
                error
            } =
                await supabaseClient
                .from("posts")
                .insert({

                    user_id:
                        user.id,

                    username:
                        username,

                    title:
                        title,

                    content:
                        content,

                    category:
                        category

                });


            if (error) {

                errorBox.textContent =
                    "Error posting: " +
                    error.message;

                button.disabled =
                    false;

                button.textContent =
                    "Publish Post";

                return;
            }


            window.location.href =
                selected.page;

        }
    );


checkLogin();

</script>

</body>
</html>
