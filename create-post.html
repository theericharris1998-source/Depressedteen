<body>

<header>
    <h1>Create a Post</h1>
    <p id="categoryText">Start a new discussion.</p>
</header>

<div class="container">

    <a class="back" id="backLink" href="index.html">
        ← Back to Forum
    </a>

    <div id="loading">
        <p>Checking your account...</p>
    </div>

    <div id="loginMessage" style="display:none;">

        <h2>You need an account</h2>

        <p>
            You must be logged in to create a post.
        </p>

        <a href="login.html">
            Log in or create an account
        </a>

    </div>

    <div id="postArea" style="display:none;">

        <h2 id="categoryTitle">New Post</h2>

        <form id="postForm">

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                required
            >

            <label for="title">Post Title</label>

            <input
                type="text"
                id="title"
                required
            >

            <label for="content">Post</label>

            <textarea
                id="content"
                required
            ></textarea>

            <button id="submitButton" type="submit">
                Publish Post
            </button>

            <div id="error"></div>

        </form>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://oumfxwatreftjyahiplr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DXNKHiVn5QV8DQj3ydTYlQ_zj9EZZTa";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const params =
    new URLSearchParams(window.location.search);

const category =
    params.get("category") || "general";


const categoryInfo = {

    general: {
        name: "General Discussion",
        page: "general.html"
    },

    gaming: {
        name: "Gaming",
        page: "gaming.html"
    },

    "off-topic": {
        name: "Off-Topic",
        page: "off-topic.html"
    }

};


const selected =
    categoryInfo[category] ||
    categoryInfo.general;


document.getElementById("categoryText").textContent =
    "Create a post in " + selected.name;


document.getElementById("categoryTitle").textContent =
    selected.name;


document.getElementById("backLink").href =
    selected.page;


/* Check whether the user is logged in */

async function checkLogin() {

    const loading =
        document.getElementById("loading");

    const loginMessage =
        document.getElementById("loginMessage");

    const postArea =
        document.getElementById("postArea");


    const {
        data: {
            user
        }
    } = await supabaseClient.auth.getUser();


    loading.style.display = "none";


    if (!user) {

        loginMessage.style.display = "block";

        return;
    }


    postArea.style.display = "block";


    const savedUsername =
        localStorage.getItem("forumUsername");


    if (savedUsername) {

        document.getElementById("username").value =
            savedUsername;

    }

}


document
    .getElementById("postForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const username =
            document
            .getElementById("username")
            .value
            .trim();


        const title =
            document
            .getElementById("title")
            .value
            .trim();


        const content =
            document
            .getElementById("content")
            .value
            .trim();


        const errorBox =
            document.getElementById("error");


        const button =
            document.getElementById("submitButton");


        errorBox.textContent = "";


        if (!username || !title || !content) {

            errorBox.textContent =
                "Please fill out every field.";

            return;
        }


        /* Save username for later */

        localStorage.setItem(
            "forumUsername",
            username
        );


        button.disabled = true;

        button.textContent = "Publishing...";


        /* Double-check that the user is logged in */

        const {
            data: {
                user
            }
        } = await supabaseClient.auth.getUser();


        if (!user) {

            errorBox.textContent =
                "You must be logged in to post.";

            button.disabled = false;

            button.textContent = "Publish Post";

            return;
        }


        const { error } =
            await supabaseClient
            .from("posts")
            .insert({

                username: username,

                title: title,

                content: content,

                category: category

            });


        if (error) {

            errorBox.textContent =
                "Error posting: " +
                error.message;

            button.disabled = false;

            button.textContent = "Publish Post";

            return;
        }


        window.location.href =
            selected.page;

});


checkLogin();

</script>

</body>
</html>
