<script>

const SUPABASE_URL =
    "https://oumfxwatreftjyahiplr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DXNKHiVn5QV8DQj3ydTYlQ_zj9EZZTa";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const params =
    new URLSearchParams(
        window.location.search
    );

const category =
    params.get("category") ||
    "general";


const categoryInfo = {

    general: {
        name: "General Discussion",
        page: "general.html"
    },

    gaming: {
        name: "Gaming",
        page: "gaming.html"
    },

    "off-topic": {
        name: "Off-Topic",
        page: "off-topic.html"
    }

};


const selected =
    categoryInfo[category] ||
    categoryInfo.general;


document
    .getElementById("categoryText")
    .textContent =
    "Create a post in " +
    selected.name;


document
    .getElementById("categoryTitle")
    .textContent =
    selected.name;


document
    .getElementById("backLink")
    .href =
    selected.page;


/* CHECK LOGIN */

async function checkLogin() {

    const loading =
        document.getElementById("loading");

    const loginMessage =
        document.getElementById("loginMessage");

    const postArea =
        document.getElementById("postArea");


    const {
        data: {
            user
        },
        error: userError
    } =
        await supabaseClient.auth.getUser();


    loading.style.display =
        "none";


    if (userError) {

        loginMessage.style.display =
            "block";

        loginMessage.innerHTML = `

            <h2>Could not check your account</h2>

            <p>
                ${escapeHTML(
                    userError.message
                )}
            </p>

        `;

        return;
    }


    if (!user) {

        loginMessage.style.display =
            "block";

        return;
    }


    /*
     * Get the username from profiles.
     */

    const {
        data: profile,
        error: profileError
    } =
        await supabaseClient
        .from("profiles")
        .select("username")
        .eq("id", user.id)
        .maybeSingle();


    if (profileError) {

        loginMessage.style.display =
            "block";

        loginMessage.innerHTML = `

            <h2>Could not load your profile</h2>

            <p>
                ${escapeHTML(
                    profileError.message
                )}
            </p>

            <p>
                Your account is logged in, but
                the profile could not be read.
            </p>

        `;

        return;
    }


    if (!profile) {

        loginMessage.style.display =
            "block";

        loginMessage.innerHTML = `

            <h2>Profile not found</h2>

            <p>
                No profile was found for this account.
            </p>

        `;

        return;
    }


    if (!profile.username) {

        loginMessage.style.display =
            "block";

        loginMessage.innerHTML = `

            <h2>Username not found</h2>

            <p>
                Your profile exists, but it does not
                have a username.
            </p>

        `;

        return;
    }


    postArea.style.display =
        "block";


    document
        .getElementById("usernameDisplay")
        .textContent =
        "Posting as: " +
        profile.username;

}


/* CREATE POST */

document
    .getElementById("postForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const title =
                document
                .getElementById("title")
                .value
                .trim();


            const content =
                document
                .getElementById("content")
                .value
                .trim();


            const errorBox =
                document
                .getElementById("error");


            const button =
                document
                .getElementById("submitButton");


            errorBox.textContent =
                "";


            if (!title || !content) {

                errorBox.textContent =
                    "Please fill out every field.";

                return;
            }


            const {
                data: {
                    user
                },
                error: userError
            } =
                await supabaseClient.auth.getUser();


            if (userError || !user) {

                errorBox.textContent =
                    "You must be logged in to post.";

                return;
            }


            /*
             * Get current username.
             */

            const {
                data: profile,
                error: profileError
            } =
                await supabaseClient
                .from("profiles")
                .select("username")
                .eq("id", user.id)
                .maybeSingle();


            if (profileError) {

                errorBox.textContent =
                    "Could not load your profile: " +
                    profileError.message;

                return;
            }


            if (!profile) {

                errorBox.textContent =
                    "Your profile could not be found.";

                return;
            }


            if (!profile.username) {

                errorBox.textContent =
                    "Your profile does not have a username.";

                return;
            }


            button.disabled =
                true;

            button.textContent =
                "Publishing...";


            const {
                error
            } =
                await supabaseClient
                .from("posts")
                .insert({

                    user_id:
                        user.id,

                    username:
                        profile.username,

                    title:
                        title,

                    content:
                        content,

                    category:
                        category

                });


            if (error) {

                errorBox.textContent =
                    "Error posting: " +
                    error.message;

                button.disabled =
                    false;

                button.textContent =
                    "Publish Post";

                return;
            }


            window.location.href =
                selected.page;

        }
    );


/* ESCAPE HTML */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;

}


checkLogin();

</script>

</body>
</html>
