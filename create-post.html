<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Post - My Forum</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;

            background-color: #333;
            color: white;
            padding: 20px;

            max-width: 700px;
            margin: 30px auto;

            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: Arial, sans-serif;
        }

        textarea {
            height: 180px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            background-color: #333;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        .back {
            color: #333;
        }
    </style>
</head>

<body>

    <header>
        <h1>Create a Post</h1>
        <p>Start a new discussion.</p>
    </header>

    <div class="container">

        <a class="back" href="general.html">← Back to General Discussion</a>

        <form>
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your username">

            <label for="title">Post Title</label>
            <input type="text" id="title" placeholder="Enter a title">

            <label for="content">Post</label>
            <textarea id="content" placeholder="Write your post here..."></textarea>

        </form>

    </div>

</body>
</html>
