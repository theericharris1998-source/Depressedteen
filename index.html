<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Forum</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f1f1;
            color: #222;
        }

        header {
            background: #202020;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .category {
            display: block;
            background: white;
            border: 1px solid #ccc;
            padding: 18px;
            margin-bottom: 10px;
            border-radius: 6px;
            color: #222;
            text-decoration: none;
        }

        .category:hover {
            background: #e9e9e9;
        }

        .category h3 {
            margin: 0 0 5px;
        }

        .category p {
            margin: 0;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Forum</h1>
        <p>A place to talk about whatever you want.</p>
    </header>

    <div class="container">

        <h2>Forum Categories</h2>

        <a class="category" href="#">
            <h3>General Discussion</h3>
            <p>Talk about anything.</p>
        </a>

        <a class="category" href="#">
            <h3>Gaming</h3>
            <p>Discuss games, gaming news, and everything gaming-related.</p>
        </a>

        <a class="category" href="#">
            <h3>Off-Topic</h3>
            <p>Talk about things that don't fit anywhere else.</p>
        </a>

    </div>

</body>
</html>
