```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - My Forum</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #333;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 450px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #333;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #555;
        }

        button:disabled {
            background: #888;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
        }

        a {
            color: #333;
        }

        hr {
            margin: 30px 0;
            border: none;
            border-top: 1px solid #ddd;
        }
    </style>
</head>

<body>

<header>
    <h1>My Forum</h1>
    <p>Login or create an account</p>
</header>

<div class="container">

    <h2>Login</h2>

    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="loginEmail"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="loginPassword"
            required
        >

        <button
            id="loginButton"
            type="submit"
        >
            Login
        </button>

    </form>


    <hr>


    <h2>Create Account</h2>

    <form id="signupForm">

        <label>Username</label>

        <input
            type="text"
            id="signupUsername"
            placeholder="Choose a username"
            maxlength="30"
            required
        >

        <label>Email</label>

        <input
            type="email"
            id="signupEmail"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="signupPassword"
            minlength="6"
            required
        >

        <button
            id="signupButton"
            type="submit"
        >
            Create Account
        </button>

    </form>


    <p id="message"></p>

    <a href="index.html">
        ← Back to Forum
    </a>

</div>

<script>

const SUPABASE_URL =
    "https://oumfxwatreftjyahiplr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DXNKHiVn5QV8DQj3ydTYlQ_zj9EZZTa";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* LOGIN */

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            document
            .getElementById("loginEmail")
            .value
            .trim();

        const password =
            document
            .getElementById("loginPassword")
            .value;

        const message =
            document.getElementById("message");

        const button =
            document.getElementById("loginButton");


        message.textContent =
            "Logging in...";

        button.disabled = true;


        const { error } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            message.textContent =
                "Login error: " +
                error.message;

            button.disabled = false;

            return;
        }


        message.textContent =
            "Login successful!";


        setTimeout(function() {

            window.location.href =
                "index.html";

        }, 700);

    }
);


/* CREATE ACCOUNT */

document
.getElementById("signupForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const username =
            document
            .getElementById("signupUsername")
            .value
            .trim();

        const email =
            document
            .getElementById("signupEmail")
            .value
            .trim();

        const password =
            document
            .getElementById("signupPassword")
            .value;


        const message =
            document.getElementById("message");

        const button =
            document.getElementById("signupButton");


        if (username.length < 3) {

            message.textContent =
                "Username must be at least 3 characters.";

            return;
        }


        message.textContent =
            "Creating account...";

        button.disabled = true;


        /*
         * First create the Supabase account.
         */

        const {
            data,
            error
        } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password

            });


        if (error) {

            message.textContent =
                "Signup error: " +
                error.message;

            button.disabled = false;

            return;
        }


        /*
         * Supabase may require email confirmation.
         * If there is no session yet, we cannot create
         * the profile from this browser session.
         */

        if (!data.user) {

            message.textContent =
                "Account created. Check your email to continue.";

            button.disabled = false;

            return;
        }


        /*
         * Create the user's profile.
         */

        const {
            error: profileError
        } =
            await supabaseClient
            .from("profiles")
            .insert({

                id: data.user.id,

                username: username

            });


        if (profileError) {

            message.textContent =
                "Account created, but the username could not be saved: " +
                profileError.message;

            button.disabled = false;

            return;
        }


        message.textContent =
            "Account created successfully!";


        setTimeout(function() {

            window.location.href =
                "index.html";

        }, 1000);

    }
);

</script>

</body>
</html>
