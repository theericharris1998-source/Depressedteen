<script>

const SUPABASE_URL =
    "https://oumfxwatreftjyahiplr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DXNKHiVn5QV8DQj3ydTYlQ_zj9EZZTa";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const params =
    new URLSearchParams(
        window.location.search
    );

const username =
    params.get("username");


async function loadProfile() {

    const profileBox =
        document.getElementById("profile");

    const postsContainer =
        document.getElementById("posts");


    if (!username) {

        profileBox.innerHTML =
            "<p>User not found.</p>";

        postsContainer.innerHTML = "";

        return;
    }


    /*
     * Find posts belonging to this username.
     */

    const {
        data: posts,
        error
    } =
        await supabaseClient
        .from("posts")
        .select(
            "id, title, category, created_at, username"
        )
        .eq(
            "username",
            username
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        profileBox.innerHTML =
            "<p>Could not load profile.</p>";

        postsContainer.innerHTML = "";

        console.error(error);

        return;
    }


    /*
     * Show username.
     */

    profileBox.innerHTML = `

        <div class="username">
            ${escapeHTML(username)}
        </div>

        <div class="info">
            ${posts.length}
            post${posts.length === 1 ? "" : "s"}
        </div>

    `;


    /*
     * Show posts.
     */

    if (!posts || posts.length === 0) {

        postsContainer.innerHTML =
            "<p>This user hasn't made any posts yet.</p>";

        return;
    }


    postsContainer.innerHTML = "";


    posts.forEach(function(post) {

        const element =
            document.createElement("div");

        element.className =
            "post";


        element.innerHTML = `

            <div class="post-title">

                <a href="post.html?id=${post.id}">
                    ${escapeHTML(post.title)}
                </a>

            </div>

            <div class="post-info">

                ${escapeHTML(post.category)}

                ·

                ${formatDate(post.created_at)}

            </div>

        `;


        postsContainer.appendChild(element);

    });

}


/* Format date */

function formatDate(dateString) {

    return new Date(
        dateString
    ).toLocaleDateString();

}


/* Prevent HTML injection */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;

}


loadProfile();

</script>
