    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;

<body>

<header>
    <h1>My Forum</h1>
</header>

<div class="container">

    <a id="backLink" href="index.html">
        ← Back to Forum
    </a>

    <div id="post">
        <p>Loading post...</p>
    </div>

    <h2>Replies</h2>

    <div id="replies">
        <p>Loading replies...</p>
    </div>

    <div id="replyArea"></div>

</div>

<script>

const SUPABASE_URL =
    "https://oumfxwatreftjyahiplr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DXNKHiVn5QV8DQj3ydTYlQ_zj9EZZTa";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const params =
    new URLSearchParams(window.location.search);

const postId =
    Number(params.get("id"));


const categoryPages = {

    general: "general.html",

    gaming: "gaming.html",

    "off-topic": "off-topic.html"

};


/* Load the post */

async function loadPost() {

    const postContainer =
        document.getElementById("post");


    const { data, error } =
        await supabaseClient
        .from("posts")
        .select("*")
        .eq("id", postId)
        .single();


    if (error || !data) {

        postContainer.innerHTML =
            "<p>Post not found.</p>";

        return;
    }


    postContainer.innerHTML = `

        <div class="post">

            <h1>
                ${escapeHTML(data.title)}
            </h1>

            <div class="username">
                Posted by ${escapeHTML(data.username)}
            </div>

            <div class="date">
                Created: ${escapeHTML(data.created_at)}
            </div>

            <div class="content">
                ${escapeHTML(data.content)}
            </div>

        </div>

    `;


    document.getElementById("backLink").href =
        categoryPages[data.category] ||
        "index.html";
}


/* Load replies */

async function loadReplies() {

    const repliesContainer =
        document.getElementById("replies");


    const { data, error } =
        await supabaseClient
        .from("replies")
        .select("*")
        .eq("post_id", postId)
        .order("created_at", {
            ascending: true
        });


    if (error) {

        repliesContainer.innerHTML =
            "<p>Error loading replies.</p>";

        return;
    }


    if (!data || data.length === 0) {

        repliesContainer.innerHTML =
            "<p>No replies yet.</p>";

        return;
    }


    repliesContainer.innerHTML = "";


    data.forEach(function(reply) {

        const element =
            document.createElement("div");

        element.className = "reply";

        element.innerHTML = `

            <strong>
                ${escapeHTML(reply.username)}
            </strong>

            <div class="date">
                Created: ${escapeHTML(reply.created_at)}
            </div>

            <div class="content">
                ${escapeHTML(reply.content)}
            </div>

        `;

        repliesContainer.appendChild(element);

    });
}


/* Check login status */

async function setupReplyArea() {

    const replyArea =
        document.getElementById("replyArea");


    const {
        data: {
            user
        }
    } = await supabaseClient.auth.getUser();


    if (!user) {

        replyArea.innerHTML = `

            <div class="login-box">

                <h2>Want to reply?</h2>

                <p id="loginMessage">
                    You must be logged in to reply to posts.
                </p>

                <a href="login.html">
                    Log in or create an account
                </a>

            </div>

        `;

        return;
    }


    replyArea.innerHTML = `

        <div class="reply-box">

            <h2>Write a Reply</h2>

            <form id="replyForm">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    required
                >

                <label for="content">
                    Reply
                </label>

                <textarea
                    id="content"
                    required
                ></textarea>

                <button type="submit">
                    Post Reply
                </button>

                <div id="error"></div>

            </form>

        </div>

    `;


    const savedUsername =
        localStorage.getItem("forumUsername");


    if (savedUsername) {

        document.getElementById("username").value =
            savedUsername;

    }


    document
        .getElementById("replyForm")
        .addEventListener(
            "submit",
            submitReply
        );
}


/* Submit reply */

async function submitReply(event) {

    event.preventDefault();


    const username =
        document
        .getElementById("username")
        .value
        .trim();


    const content =
        document
        .getElementById("content")
        .value
        .trim();


    const errorBox =
        document.getElementById("error");


    if (!username || !content) {

        errorBox.textContent =
            "Please fill out both fields.";

        return;
    }


    localStorage.setItem(
        "forumUsername",
        username
    );


    const {
        data: {
            user
        }
    } = await supabaseClient.auth.getUser();


    if (!user) {

        errorBox.textContent =
            "You must be logged in to reply.";

        return;
    }


    const { error } =
        await supabaseClient
        .from("replies")
        .insert({

            post_id: postId,

            username: username,

            content: content

        });


    if (error) {

        errorBox.textContent =
            "Error posting reply: " +
            error.message;

        return;
    }


    document.getElementById("content").value = "";


    await loadReplies();

}


/* Escape HTML */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;
}


/* Start */

loadPost();

loadReplies();

setupReplyArea();

</script>

</body>
</html>
