<body>

<header>
    <h1>My Forum</h1>
</header>

<div class="container">

    <a id="backLink" href="index.html">
        ← Back to Forum
    </a>

    <div id="post">
        <p>Loading post...</p>
    </div>

    <h2>Replies</h2>

    <div id="replies">
        <p>Loading replies...</p>
    </div>

    <div id="replyArea"></div>

</div>

<script>

const SUPABASE_URL =
    "https://oumfxwatreftjyahiplr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DXNKHiVn5QV8DQj3ydTYlQ_zj9EZZTa";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const params =
    new URLSearchParams(window.location.search);

const postId =
    Number(params.get("id"));


/* Load the post */

async function loadPost() {

    const postContainer =
        document.getElementById("post");

    const { data, error } =
        await supabaseClient
        .from("posts")
        .select("*")
        .eq("id", postId)
        .single();

    if (error || !data) {

        postContainer.innerHTML =
            "<p>Post not found.</p>";

        return;
    }

    postContainer.innerHTML = `

        <div class="post">

            <h1>
                ${escapeHTML(data.title)}
            </h1>

            <div class="username">
                Posted by ${escapeHTML(data.username || "Unknown")}
            </div>

            <div class="date">
                Created: ${escapeHTML(data.created_at)}
            </div>

            <div class="content">
                ${escapeHTML(data.content)}
            </div>

        </div>

    `;

    const categoryPages = {

        general: "general.html",

        gaming: "gaming.html",

        "off-topic": "off-topic.html"

    };

    document.getElementById("backLink").href =
        categoryPages[data.category] ||
        "index.html";
}


/* Load replies */

async function loadReplies() {

    const repliesContainer =
        document.getElementById("replies");

    const { data, error } =
        await supabaseClient
        .from("replies")
        .select("*")
        .eq("post_id", postId)
        .order("created_at", {
            ascending: true
        });

    if (error) {

        repliesContainer.innerHTML =
            "<p>Error loading replies.</p>";

        return;
    }

    if (!data || data.length === 0) {

        repliesContainer.innerHTML =
            "<p>No replies yet.</p>";

        return;
    }

    repliesContainer.innerHTML = "";

    data.forEach(function(reply) {

        const element =
            document.createElement("div");

        element.className = "reply";

        element.innerHTML = `

            <strong>
                ${escapeHTML(reply.username || "Unknown")}
            </strong>

            <div class="date">
                Created: ${escapeHTML(reply.created_at)}
            </div>

            <div class="content">
                ${escapeHTML(reply.content)}
            </div>

        `;

        repliesContainer.appendChild(element);

    });
}


/* Set up reply area */

async function setupReplyArea() {

    const replyArea =
        document.getElementById("replyArea");

    const {
        data: {
            user
        }
    } = await supabaseClient.auth.getUser();
console.log("Logged in user ID:", user?.id);

    /* Not logged in */

    if (!user) {

        replyArea.innerHTML = `

            <div class="login-box">

                <h2>Want to reply?</h2>

                <p>
                    You must be logged in to reply.
                </p>

                <a href="login.html">
                    Log in or create an account
                </a>

            </div>

        `;

        return;
    }


    /* Find the user's profile */

    const { data: profile, error } =
        await supabaseClient
        .from("profiles")
        .select("username")
        .eq("id", user.id)
        .single();


    if (error || !profile) {

        replyArea.innerHTML = `

            <div class="login-box">

                <h2>Profile not found</h2>

                <p>
                    Your account does not have a username yet.
                </p>

            </div>

        `;

        return;
    }


    /* Show reply form */

    replyArea.innerHTML = `

        <div class="reply-box">

            <h2>Reply as ${escapeHTML(profile.username)}</h2>

            <form id="replyForm">

                <textarea
                    id="content"
                    placeholder="Write your reply..."
                    required
                ></textarea>

                <button
                    id="replyButton"
                    type="submit"
                >
                    Post Reply
                </button>

                <div id="error"></div>

            </form>

        </div>

    `;


    document
        .getElementById("replyForm")
        .addEventListener(
            "submit",
            submitReply
        );
}


/* Submit reply */

async function submitReply(event) {

    event.preventDefault();

    const content =
        document
        .getElementById("content")
        .value
        .trim();

    const errorBox =
        document.getElementById("error");

    const button =
        document.getElementById("replyButton");


    errorBox.textContent = "";


    if (!content) {

        errorBox.textContent =
            "Please write a reply.";

        return;
    }


    const {
        data: {
            user
        }
    } = await supabaseClient.auth.getUser();


    if (!user) {

        errorBox.textContent =
            "You must be logged in.";

        return;
    }


    /* Get the username from the profile */

    const { data: profile, error: profileError } =
        await supabaseClient
        .from("profiles")
        .select("username")
        .eq("id", user.id)
        .single();


    if (profileError || !profile) {

        errorBox.textContent =
            "Could not find your profile.";

        return;
    }


    button.disabled = true;

    button.textContent =
        "Posting...";


    const { error } =
        await supabaseClient
        .from("replies")
        .insert({

            post_id: postId,

            user_id: user.id,

            username: profile.username,

            content: content

        });


    if (error) {

        errorBox.textContent =
            "Error posting reply: " +
            error.message;

        button.disabled = false;

        button.textContent =
            "Post Reply";

        return;
    }


    document
        .getElementById("content")
        .value = "";


    button.disabled = false;

    button.textContent =
        "Post Reply";


    await loadReplies();

}


/* Prevent HTML injection */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;
}


/* Start */

loadPost();

loadReplies();

setupReplyArea();

</script>

</body>
</html>
