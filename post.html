<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post - My Forum</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;

<body>

<header>
    <h1>My Forum</h1>
</header>

<div class="container">

    <a id="backLink" href="index.html">
        ← Back to Forum
    </a>

    <div id="post">
        <p>Loading post...</p>
    </div>

    <h2>Replies</h2>

    <div id="replies">
        <p>Loading replies...</p>
    </div>

    <div class="reply-box">

        <h2>Write a Reply</h2>

        <form id="replyForm">

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                required
            >

            <label for="content">Reply</label>

            <textarea
                id="content"
                required
            ></textarea>

            <button type="submit">
                Post Reply
            </button>

            <div id="error"></div>

        </form>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://oumfxwatreftjyahiplr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DXNKHiVn5QV8DQj3ydTYlQ_zj9EZZTa";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const params =
    new URLSearchParams(window.location.search);

const postId =
    Number(params.get("id"));


/* Load saved username */

const savedUsername =
    localStorage.getItem("forumUsername");

if (savedUsername) {

    document.getElementById("username").value =
        savedUsername;

}


/* Load the main post */

async function loadPost() {

    const postContainer =
        document.getElementById("post");

    const { data, error } =
        await supabaseClient
        .from("posts")
        .select("*")
        .eq("id", postId)
        .single();


    if (error || !data) {

        postContainer.innerHTML =
            "<p>Post not found.</p>";

        return;
    }


    postContainer.innerHTML = `

        <div class="post">

            <h1>
                ${escapeHTML(data.title)}
            </h1>

            <div class="username">
                Posted by ${escapeHTML(data.username)}
            </div>

            <div class="date">
                Created: ${escapeHTML(data.created_at)}
            </div>

            <div class="content">
                ${escapeHTML(data.content)}
            </div>

        </div>

    `;


    const categoryPages = {

        general: "general.html",

        gaming: "gaming.html",

        "off-topic": "off-topic.html"

    };


    document.getElementById("backLink").href =
        categoryPages[data.category] ||
        "index.html";
}


/* Load replies */

async function loadReplies() {

    const repliesContainer =
        document.getElementById("replies");


    const { data, error } =
        await supabaseClient
        .from("replies")
        .select("*")
        .eq("post_id", postId)
        .order("created_at", {
            ascending: true
        });


    if (error) {

        repliesContainer.innerHTML =
            "<p>Error loading replies.</p>";

        return;
    }


    if (!data || data.length === 0) {

        repliesContainer.innerHTML =
            "<p>No replies yet.</p>";

        return;
    }


    repliesContainer.innerHTML = "";


    data.forEach(function(reply) {

        const element =
            document.createElement("div");

        element.className = "reply";

        element.innerHTML = `

            <strong>
                ${escapeHTML(reply.username)}
            </strong>

            <div class="date">
                Created: ${escapeHTML(reply.created_at)}
            </div>

            <div class="content">
                ${escapeHTML(reply.content)}
            </div>

        `;

        repliesContainer.appendChild(element);

    });
}


/* Post a reply */

document
    .getElementById("replyForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const username =
            document
            .getElementById("username")
            .value
            .trim();


        const content =
            document
            .getElementById("content")
            .value
            .trim();


        const errorBox =
            document.getElementById("error");


        errorBox.textContent = "";


        if (!username || !content) {

            errorBox.textContent =
                "Please enter a username and reply.";

            return;
        }


        /* Remember username */

        localStorage.setItem(
            "forumUsername",
            username
        );


        const { error } =
            await supabaseClient
            .from("replies")
            .insert({

                post_id: postId,

                username: username,

                content: content

            });


        if (error) {

            errorBox.textContent =
                "Error posting reply: " +
                error.message;

            return;
        }


        document
            .getElementById("content")
            .value = "";


        loadReplies();

});


function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;
}


loadPost();

loadReplies();

</script>

</body>
</html>
