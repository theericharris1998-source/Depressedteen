<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post - My Forum</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;

        }

        header {
            background-color: #333;

            resize: vertical;

            display: block;

            margin-top: 15px;

            background-color: #555;
        }

            color: #b00020;
            margin-top: 15px;
        }

        #status {
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>My Forum</h1>
</header>

<div class="container">

    <a class="back" id="backLink" href="index.html">
        ← Back to Forum
    </a>

    <div id="post">
        <p id="status">Loading post...</p>
    </div>

    <h2>Replies</h2>

    <div id="replies">
        <p>Loading replies...</p>
    </div>

    <div class="reply-box">

        <h2>Write a Reply</h2>

        <form id="replyForm">

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                required
            >

            <label for="content">Reply</label>
            <textarea
                id="content"
                required
            ></textarea>

            <button type="submit">
                Post Reply
            </button>

            <div id="error"></div>

        </form>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://oumfxwatreftjyahiplr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DXNKHiVn5QV8DQj3ydTYlQ_zj9EZZTa";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const params =
    new URLSearchParams(window.location.search);

const postId =
    params.get("id");


const categoryPages = {
    general: "general.html",
    gaming: "gaming.html",
    "off-topic": "off-topic.html"
};


async function loadPost() {

    const postContainer =
        document.getElementById("post");

    if (!postId) {

        postContainer.innerHTML =
            "<p>Post not found.</p>";

        return;
    }


    const { data, error } =
        await supabaseClient
        .from("posts")
        .select("*")
        .eq("id", postId)
        .single();


    if (error || !data) {

        postContainer.innerHTML =
            "<p>Post not found.</p>";

        return;
    }


    postContainer.innerHTML = `

        <div class="post">

            <h1>
                ${escapeHTML(data.title)}
            </h1>

            <div class="username">
                Posted by ${escapeHTML(data.username)}
            </div>

            <div class="content">
                ${escapeHTML(data.content)}
            </div>

        </div>

    `;


    document.getElementById("backLink").href =
        categoryPages[data.category] ||
        "index.html";
}


async function loadReplies() {

    const repliesContainer =
        document.getElementById("replies");


    const { data, error } =
        await supabaseClient
        .from("replies")
        .select("*")
        .eq("post_id", postId)
        .order("created_at", {
            ascending: true
        });


    if (error) {

        repliesContainer.innerHTML =
            "<p>Could not load replies.</p>";

        return;
    }


    if (!data || data.length === 0) {

        repliesContainer.innerHTML =
            "<p>No replies yet.</p>";

        return;
    }


    repliesContainer.innerHTML = "";


    data.forEach(function(reply) {

        const element =
            document.createElement("div");

        element.className = "reply";

        element.innerHTML = `

            <strong>
                ${escapeHTML(reply.username)}
            </strong>

            <div class="content">
                ${escapeHTML(reply.content)}
            </div>

        `;

        repliesContainer.appendChild(element);

    });
}


document.getElementById("replyForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const username =
        document.getElementById("username")
        .value
        .trim();

    const content =
        document.getElementById("content")
        .value
        .trim();

    const errorBox =
        document.getElementById("error");


    errorBox.textContent = "";


    if (!username || !content) {

        errorBox.textContent =
            "Please enter a username and reply.";

        return;
    }


    const button =
        document.querySelector("#replyForm button");

    button.disabled = true;

    button.textContent = "Posting...";


    const { error } =
        await supabaseClient
        .from("replies")
        .insert({

            post_id: Number(postId),

            username: username,

            content: content

        });


    if (error) {

        errorBox.textContent =
            "Error posting reply: " +
            error.message;

        button.disabled = false;

        button.textContent = "Post Reply";

        return;
    }


    document.getElementById("content").value = "";


    button.disabled = false;

    button.textContent = "Post Reply";


    await loadReplies();

});


function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;
}


loadPost();

loadReplies();

</script>

</body>
</html>
