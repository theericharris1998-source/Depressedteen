    <style>
        body {

<body>

<header>
    <h1>My Forum</h1>
</header>

<div class="container">

    <a href="index.html">
        ← Back to Forum
    </a>

    <h2>My Account</h2>

    <div id="loading">
        Loading account...
    </div>

    <div
        id="profile"
        class="profile"
        style="display:none;"
    >

        <div class="label">
            Username
        </div>

        <div id="usernameDisplay" class="username-row">

            <span
                class="value"
                id="username"
                style="margin:0;"
            ></span>

            <button
                class="edit-button"
                id="editUsernameButton"
            >
                Edit
            </button>

        </div>

        <div
            id="usernameEdit"
            class="hidden"
        >

            <input
                type="text"
                id="usernameInput"
                maxlength="30"
                placeholder="Enter new username"
            >

            <button
                class="save-button"
                id="saveUsernameButton"
            >
                Save
            </button>

            <button
                class="cancel-button"
                id="cancelUsernameButton"
            >
                Cancel
            </button>

        </div>

        <div class="label">
            Email
        </div>

        <div
            class="value"
            id="email"
        ></div>

        <button id="logoutButton">
            Log Out
        </button>

        <div id="error"></div>

        <div id="success"></div>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://oumfxwatreftjyahiplr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DXNKHiVn5QV8DQj3ydTYlQ_zj9EZZTa";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentUser = null;


/* LOAD ACCOUNT */

async function loadAccount() {

    const loading =
        document.getElementById("loading");

    const profile =
        document.getElementById("profile");


    const {
        data: {
            user
        }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {

        loading.innerHTML = `
            <p>You are not logged in.</p>

            <a href="login.html">
                Log in or create an account
            </a>
        `;

        return;
    }


    currentUser = user;


    const username =
        user.user_metadata?.username;


    if (!username) {

        loading.innerHTML = `
            <p>Your account does not have a username yet.</p>
        `;

        return;
    }


    loading.style.display =
        "none";

    profile.style.display =
        "block";


    document
        .getElementById("username")
        .textContent =
        username;


    document
        .getElementById("usernameInput")
        .value =
        username;


    document
        .getElementById("email")
        .textContent =
        user.email || "No email available";

}


/* EDIT USERNAME */

document
    .getElementById("editUsernameButton")
    .addEventListener(
        "click",
        function() {

            document
                .getElementById("usernameDisplay")
                .classList
                .add("hidden");

            document
                .getElementById("usernameEdit")
                .classList
                .remove("hidden");

            document
                .getElementById("usernameInput")
                .focus();

        }
    );


/* CANCEL USERNAME EDIT */

document
    .getElementById("cancelUsernameButton")
    .addEventListener(
        "click",
        function() {

            document
                .getElementById("usernameDisplay")
                .classList
                .remove("hidden");

            document
                .getElementById("usernameEdit")
                .classList
                .add("hidden");

            document
                .getElementById("usernameInput")
                .value =
                currentUser
                    .user_metadata
                    ?.username || "";

        }
    );


/* SAVE USERNAME */

document
    .getElementById("saveUsernameButton")
    .addEventListener(
        "click",
        async function() {

            const input =
                document
                .getElementById("usernameInput");

            const saveButton =
                document
                .getElementById("saveUsernameButton");

            const errorBox =
                document
                .getElementById("error");

            const successBox =
                document
                .getElementById("success");


            const newUsername =
                input.value.trim();


            errorBox.textContent =
                "";

            successBox.textContent =
                "";


            if (newUsername.length < 3) {

                errorBox.textContent =
                    "Username must be at least 3 characters.";

                return;
            }


            saveButton.disabled =
                true;

            saveButton.textContent =
                "Saving...";


            /*
             * Update the username in
             * Supabase Auth metadata.
             */

            const {
                data,
                error
            } =
                await supabaseClient.auth.updateUser({

                    data: {

                        username:
                            newUsername

                    }

                });


            if (error) {

                errorBox.textContent =
                    "Error changing username: " +
                    error.message;

                saveButton.disabled =
                    false;

                saveButton.textContent =
                    "Save";

                return;
            }


            /*
             * Also update the username
             * in the profiles table.
             */

            const {
                error: profileError
            } =
                await supabaseClient
                .from("profiles")
                .update({

                    username:
                        newUsername

                })
                .eq(
                    "id",
                    currentUser.id
                );


            if (profileError) {

                errorBox.textContent =
                    "Username changed, but the profile could not be updated: " +
                    profileError.message;

                saveButton.disabled =
                    false;

                saveButton.textContent =
                    "Save";

                return;
            }


            currentUser =
                data.user;


            document
                .getElementById("username")
                .textContent =
                newUsername;


            document
                .getElementById("usernameDisplay")
                .classList
                .remove("hidden");


            document
                .getElementById("usernameEdit")
                .classList
                .add("hidden");


            successBox.textContent =
                "Username updated successfully!";


            saveButton.disabled =
                false;

            saveButton.textContent =
                "Save";

        }
    );


/* LOG OUT */

document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        async function() {

            const errorBox =
                document
                .getElementById("error");


            const {
                error
            } =
                await supabaseClient.auth.signOut();


            if (error) {

                errorBox.textContent =
                    "Error logging out: " +
                    error.message;

                return;
            }


            window.location.href =
                "index.html";

        }
    );


loadAccount();

</script>

</body>
</html>
