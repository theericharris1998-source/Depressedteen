<body>

<header>
    <h1>My Forum</h1>
</header>

<div class="container">

    <a href="index.html">
        ← Back to Forum
    </a>

    <h2>My Account</h2>

    <div id="loading">
        Loading account...
    </div>

    <div id="profile" class="profile" style="display: none;">

        <div class="label">
            Username
        </div>

        <div class="value" id="username"></div>

        <div class="label">
            Email
        </div>

        <div class="value" id="email"></div>

        <button id="logoutButton">
            Log Out
        </button>

        <div id="error"></div>

        <div id="success"></div>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://oumfxwatreftjyahiplr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DXNKHiVn5QV8DQj3ydTYlQ_zj9EZZTa";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function loadAccount() {

    const loading =
        document.getElementById("loading");

    const profile =
        document.getElementById("profile");


    const {
        data: {
            user
        }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {

        loading.innerHTML = `
            <p>You are not logged in.</p>

            <a href="login.html">
                Log in or create an account
            </a>
        `;

        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
        .from("profiles")
        .select("username")
        .eq("id", user.id)
        .single();


    if (error || !data) {

        loading.innerHTML = `
            <p>Could not load your profile.</p>
            <p>Please log out and log back in.</p>
        `;

        return;
    }


    loading.style.display =
        "none";

    profile.style.display =
        "block";


    document
        .getElementById("username")
        .textContent =
        data.username;


    document
        .getElementById("email")
        .textContent =
        user.email || "No email available";

}


/* LOG OUT */

document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        async function() {

            const button =
                document.getElementById("logoutButton");

            const errorBox =
                document.getElementById("error");

            const successBox =
                document.getElementById("success");


            errorBox.textContent = "";

            successBox.textContent =
                "Logging out...";

            button.disabled =
                true;


            const {
                error
            } =
                await supabaseClient.auth.signOut();


            if (error) {

                successBox.textContent =
                    "";

                errorBox.textContent =
                    "Error logging out: " +
                    error.message;

                button.disabled =
                    false;

                return;
            }


            window.location.href =
                "index.html";

        }
    );


loadAccount();

</script>

</body>
</html>
